name: Xray RU Direct deployment and browser test
on:
  push:
    branches: [test]
    paths:
      - 'Templates/Routing-(RU-Direct)/routing-ru.json'
      - 'source/routing/sites.txt'
      - 'source/xray-test/**'
      - '.github/workflows/xray-routing-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-routing-test
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare and test browser harness
        shell: bash
        working-directory: source/xray-test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/xray-test-browsers
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = Admiralteskiy
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --only-shell chromium
          bash -n deploy.sh
          npm test
  deploy-and-browse:
    needs: validate
    if: github.ref == 'refs/heads/test'
    runs-on: [self-hosted, Linux, X64]
    environment: xray-routing-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare browser
        working-directory: source/xray-test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/xray-test-browsers
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = Admiralteskiy
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --only-shell chromium
      - name: Check deployment settings
        id: settings
        shell: bash
        env:
          XRAY_HOST: ${{ vars.XRAY_HOST }}
        run: |
          if [ -z "$XRAY_HOST" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Live deployment skipped: configure the xray-routing-test Environment first.'
            echo '### Live Xray deployment skipped: XRAY_HOST is not configured in xray-routing-test.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate, deploy and browse through SSH tunnel
        if: steps.settings.outputs.enabled == 'true'
        shell: bash
        env:
          XRAY_HOST: ${{ vars.XRAY_HOST }}
          XRAY_USER: ${{ vars.XRAY_USER }}
          XRAY_SSH_PORT: ${{ vars.XRAY_SSH_PORT }}
          XRAY_IMAGE: ${{ vars.XRAY_IMAGE }}
          XRAY_SSH_KEY: ${{ secrets.XRAY_SSH_KEY }}
          XRAY_KNOWN_HOSTS: ${{ secrets.XRAY_KNOWN_HOSTS }}
          XRAY_EVIDENCE: ${{ runner.temp }}/xray-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/xray-test-browsers
        run: bash source/xray-test/deploy.sh
      - name: Save diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xray-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xray-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
