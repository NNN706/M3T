name: Xray RU Direct deployment and browser test
on:
  push:
    branches: [test]
    paths:
      - 'Templates/Routing-(RU-Direct)/routing-ru.json'
      - 'source/routing/sites.txt'
      - 'source/xray-test/**'
      - '.github/workflows/xray-routing-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-routing-test
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare and test browser harness
        shell: bash
        working-directory: source/xray-test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/xray-test-browsers
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = Admiralteskiy
          df -h / /var "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --only-shell chromium
          bash -n deploy.sh
          npm test
  deploy-and-browse:
    needs: validate
    if: github.ref == 'refs/heads/test'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare browser
        working-directory: source/xray-test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/xray-test-browsers
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = Admiralteskiy
          df -h / /var "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --only-shell chromium
      - name: Run Xray and verify routing through local SOCKS
        shell: bash
        env:
          XRAY_DOCKER_SUDO: '1'
          XRAY_IMAGE: ghcr.io/xtls/xray-core:26.10.31@sha256:ceabeac03a89d991d2a247361825c1d1d2e9c91cd5dc010f298c7dc0c2f325c9
          XRAY_EVIDENCE: ${{ runner.temp }}/xray-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/xray-test-browsers
        run: bash source/xray-test/deploy.sh
      - name: Save diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xray-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xray-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
