name: Daily full routing refresh
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  dispatch-full-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue full scan on selected branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: gh workflow run routing-update.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" -f full_refresh=true
