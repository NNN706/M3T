name: Daily full routing refresh
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  dispatch-full-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue full scan on test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run routing-update.yml --repo "$GITHUB_REPOSITORY" --ref test -f full_refresh=true
